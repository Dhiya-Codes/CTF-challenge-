<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Door 4</title><style>
:root{--bg:#161b22;--ink:#e6e1d6;--dim:#8b949e;--red:#e5534b;--line:#30363d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:620px;width:100%;border:1px solid var(--line);padding:32px;border-left:6px solid var(--red)}
h1{font-size:28px;margin:0 0 6px}p{margin:10px 0}.dim{color:var(--dim)}
input{width:100%;padding:10px;margin:8px 0;background:#0d1117;border:1px solid var(--line);color:var(--ink);font:16px monospace}
button{padding:10px 18px;background:var(--red);color:#fff;border:0;font:16px Georgia,serif;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink)}
code,.mono{font-family:monospace;word-break:break-all}.msg{margin-top:14px;min-height:24px}.ok{margin-top:14px;padding:12px 14px;border-left:4px solid #3fb950;background:#12261a}a{color:#7ee787}
</style></head><body><main><h1>Door 4: The keypad</h1><p>The keypad only accepts one password. Nobody saw it typed. The answer lives in how the keypad checks it.</p>
<input id="k" placeholder="Password"><button onclick="go()">Unlock</button><p class="msg mono" id="m"></p></main><script>
var _a=[99, 104, 124, 112, 127, 135, 138, 122],_b="233d33345052031d1719040244010a0a004f051f0b1d5a2d0213141c10301b4b035c09040903";
function go(){var v=document.getElementById('k').value,m=document.getElementById('m');
if(v.length!=_a.length){m.textContent='Wrong password.';return}
for(var i=0;i<v.length;i++){if(((v.charCodeAt(i)^23)+i*3)!==_a[i]){m.textContent='Wrong password.';return}}
var o='';for(var j=0;j<_b.length;j+=2){o+=String.fromCharCode(parseInt(_b.substr(j,2),16)^v.charCodeAt((j/2)%v.length))}
m.innerHTML='<div class="ok"><b>Door 4 unlocked!</b><br>You cracked the keypad.</div><p class="mono">'+o.replace(/next=(\S+)/,'<br>Next door: <a href="$1">$1</a>')+'</p>'}
</script></body></html>
